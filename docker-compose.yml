services:
  # 1. Service Database (PostGIS)
  db:
    image: postgis/postgis:16-3.4 # Gunakan image resmi PostGIS
    container_name: geo_db
    restart: always
    environment:
      POSTGRES_DB: geodb
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopassword
    volumes:
      - ./pgdata:/var/lib/postgresql/data # Ini jawaban Anda! Mapping folder pgdata
    ports:
      - "5433:5432" # Akses dari PC Anda di port 5433 (agar tidak bentrok)
    networks:
      - geo_network

  # 2. Service Backend (Laravel / PHP-FPM)
  backend:
    build:
      context: ./backend # Mengacu ke folder backend
      dockerfile: Dockerfile
    container_name: geo_backend
    volumes:
      - ./backend:/var/www/html # Sinkronisasi kode Laravel Anda
      - ./data:/var/www/html/data_geojson # Mount folder data untuk GeoJSON
    networks:
      - geo_network
    depends_on:
      - db # Pastikan db menyala terlebih dahulu

  # 3. Service Frontend (Vue / F7 Dev Server)
  frontend:
    build:
      context: ./frontend # Mengacu ke folder frontend
      dockerfile: Dockerfile
    container_name: geo_frontend
    ports:
      - "5173:5173" # Expose port dev server (biasanya 5173)
    volumes:
      - ./frontend:/app # Sinkronisasi kode Vue Anda
      - /app/node_modules # Mencegah local node_modules menimpa container
    networks:
      - geo_network
    stdin_open: true # Diperlukan untuk hot-reloading
    tty: true

  # 4. Service Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: geo_nginx
    restart: always
    ports:
      - "8000:80" # Laravel Anda akan diakses di http://localhost:8000
    volumes:
      - ./backend:/var/www/html # Nginx perlu akses ke file public Laravel
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # File konfigurasi
    networks:
      - geo_network
    depends_on:
      - backend

# Definisi Jaringan
networks:
  geo_network:
    driver: bridge
